server:
  port: 8080

spring:
  application:
    name: flowable-framework
  datasource:
    url: jdbc:h2:file:./data/flowable;AUTO_SERVER=TRUE;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema/app-schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: satoken
  timeout: 86400
  is-log: false

# To switch to MySQL later, replace spring.datasource.* and add the MySQL driver.
flowable:
  # 启动时自动创建/升级 Process、CMMN、DMN、App、IDM、Event Registry 等全部引擎表
  database-schema-update: true
  check-process-definitions: true
  process-definition-location-prefix: classpath*:/processes/
  cmmn:
    database-schema-update: true
  dmn:
    database-schema-update: true
  app:
    database-schema-update: true
  idm:
    database-schema-update: true
  eventregistry:
    database-schema-update: true
